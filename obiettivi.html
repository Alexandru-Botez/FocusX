<!DOCTYPE html>
<!--
  =====================================================================
  OBIETTIVI.HTML: la pagina Obiettivi, per creare, modificare ed eliminare gli obiettivi.
  Stile: css/styles.css. Comportamento: js/menu.js e js/obiettivi.js.

  Sezioni, nell'ordine:
    - HEAD: informazioni sulla pagina e file collegati
    - INTESTAZIONE E MENU, uguale in tutte le pagine
    - ICONE: il disegno della fiammina, scritto una volta sola
    - TITOLO E PULSANTE CREA
    - MODULO DELL'OBIETTIVO: nome, progetto, data e l'avviso dei doppioni
    - SCELTA DELLE FIAMMINE, dentro il modulo
    - ELENCO DEGLI OBIETTIVI
    - MESSAGGI
  =====================================================================
-->
<html lang="it">
  <!-- =================================================================
       SEZIONE HEAD
       Informazioni sulla pagina e file collegati.
       Il parametro ?v nei percorsi cambia a ogni modifica di un file,
       così il browser non usa una vecchia copia salvata.
       type="module": ogni file JavaScript è un modulo, con i suoi nomi
       privati, che parte dopo che il browser ha letto tutto l'HTML.
       I moduli funzionano solo aprendo la pagina da un server
       (python -m http.server), non con un doppio clic sul file.
       ================================================================= -->
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Obiettivi</title>
    <link rel="icon" type="image/svg+xml" href="assets/focusx-mark.svg?v=fiamma-concentrata-2">
    <link rel="stylesheet" href="css/styles.css?v=numero-blu-1">
    <script type="module" src="js/menu.js?v=avvia-1"></script>
    <script type="module" src="js/obiettivi.js?v=status-1"></script>
  </head>

  <body>
    <!-- =================================================================
         SEZIONE INTESTAZIONE E MENU
         Pulsante del menu, logo, nome dell'app e pannello del menu.
         È uguale in tutte e tre le pagine: cambia solo la voce con
         aria-current="page", quella della pagina aperta.
         Se la modifichi, aggiorna tutti e tre i file HTML.
         JavaScript: js/menu.js.
         ================================================================= -->
    <header>
      <!-- Quando il menu si apre, l'icona a tre linee si trasforma in una X dentro un cerchio. -->
      <button id="menu-button" type="button" aria-label="Menu" aria-expanded="false" aria-controls="sidebar-menu" title="Menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round">
            <!-- L'ordine dei sei path è importante: il CSS li seleziona con nth-child. -->
            <path d="M72 82.286h28.75"></path>
            <path d="M100.75 103.714l72.482-.143c.043 39.398-32.284 71.434-72.16 71.434-39.878 0-72.204-32.036-72.204-71.554"></path>
            <path d="M72 125.143h28.75"></path>
            <path d="M100.75 103.714l-71.908-.143c.026-39.638 32.352-71.674 72.23-71.674 39.876 0 72.203 32.036 72.203 71.554"></path>
            <path d="M100.75 82.286h28.75"></path>
            <path d="M100.75 125.143h28.75"></path>
          </g>
        </svg>
      </button>

      <!--
        Il logo è un link a Home, come il nome FocusX accanto. Per la tastiera e i lettori
        di schermo basta il link del nome: tabindex="-1" e aria-hidden="true" evitano
        che lo stesso link venga raggiunto e annunciato due volte.
      -->
      <a class="brand-logo-link" href="index.html" tabindex="-1" aria-hidden="true">
        <img class="brand-logo" src="assets/focusx-mark.svg?v=fiamma-concentrata-2" alt="" width="44" height="44">
      </a>

      <h1><a class="brand-link" href="index.html">FocusX</a></h1>

      <!--
        Il pannello del menu. Il CSS lo sovrappone a logo e titolo, lasciando sopra il pulsante.
        inert lo rende non interattivo finché è chiuso: js/menu.js lo toglie quando si apre.
        Statistica e Impostazioni per ora sono pulsanti senza destinazione:
        le loro pagine non esistono ancora.
      -->
      <nav id="sidebar-menu" class="sidebar-menu" aria-label="Navigazione principale" inert>
        <ul>
          <li>
            <a class="menu-option" href="index.html">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Una casa: la pagina iniziale, quella del timer. -->
                <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H4a1 1 0 0 1-1-1v-9.5Z"></path>
              </svg>
              <span>Home</span>
            </a>
          </li>
          <li>
            <a class="menu-option" href="progetti.html">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Una cartella: i progetti. -->
                <path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"></path>
              </svg>
              <span>Progetti</span>
            </a>
          </li>
          <li>
            <a class="menu-option" href="obiettivi.html" aria-current="page">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Un bersaglio: gli obiettivi. -->
                <circle cx="12" cy="12" r="9"></circle>
                <circle cx="12" cy="12" r="5"></circle>
                <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"></circle>
              </svg>
              <span>Obiettivi</span>
            </a>
          </li>
          <li>
            <button class="menu-option" type="button">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Tre barre di altezza diversa: le statistiche. -->
                <path d="M3 3v18h18M7 17v-5M12 17V8M17 17V5"></path>
              </svg>
              <span>Statistica</span>
            </button>
          </li>
          <li>
            <button class="menu-option" type="button">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Un ingranaggio con otto denti: le impostazioni. -->
                <path d="M19.2 10.27L21.91 10.67V13.33L19.2 13.73A7.4 7.4 0 0 1 18.31 15.87L19.95 18.07L18.07 19.95L15.87 18.31A7.4 7.4 0 0 1 13.73 19.2L13.33 21.91H10.67L10.27 19.2A7.4 7.4 0 0 1 8.13 18.31L5.93 19.95L4.05 18.07L5.69 15.87A7.4 7.4 0 0 1 4.8 13.73L2.09 13.33V10.67L4.8 10.27A7.4 7.4 0 0 1 5.69 8.13L4.05 5.93L5.93 4.05L8.13 5.69A7.4 7.4 0 0 1 10.27 4.8L10.67 2.09H13.33L13.73 4.8A7.4 7.4 0 0 1 15.87 5.69L18.07 4.05L19.95 5.93L18.31 8.13A7.4 7.4 0 0 1 19.2 10.27Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span>Impostazioni</span>
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <!-- =================================================================
         SEZIONE ICONE
         Il disegno della fiammina, scritto una volta sola: ogni
         <use href="#flame-icon"> nella pagina lo richiama.
         ================================================================= -->
    <svg hidden>
      <symbol id="flame-icon" viewBox="0 0 24 24">
        <path d="M12 2.5c.6 3.2 2.6 4.9 4.2 6.9 1.4 1.7 2.3 3.5 2.3 5.6a6.5 6.5 0 0 1-13 0c0-2.4 1.2-4.4 2.9-5.9.1 1.5.8 2.7 2 3.2-.6-3.4.3-6.8 1.6-9.8Z"></path>
      </symbol>
    </svg>

    <!--
      La pagina riutilizza le classi di layout, modulo e pulsanti della pagina Progetti
      (projects-main, project-form, project-action...), così le due pagine restano coerenti.
    -->
    <main class="projects-main">
      <section class="projects-section" aria-labelledby="goals-heading">
        <!-- ===============================================================
             SEZIONE TITOLO E PULSANTE CREA
             Il titolo della pagina, il pulsante che apre il modulo vuoto
             e l'avviso che compare quando non c'è ancora nessun progetto.
             =============================================================== -->
        <div class="projects-heading-row">
          <h2 id="goals-heading">Obiettivi</h2>
          <button id="new-goal-button" class="project-action project-action-primary" type="button">Crea obiettivo</button>
        </div>

        <!--
          Ogni obiettivo appartiene a un progetto: senza progetti, JavaScript nasconde
          Crea obiettivo e mostra questo avviso, che porta a crearne uno.
        -->
        <p id="goals-no-projects" class="projects-empty" hidden>
          Per creare un obiettivo serve almeno un progetto. <a href="progetti.html">Vai ai progetti</a>
        </p>

        <!-- ===============================================================
             SEZIONE MODULO DELL'OBIETTIVO
             Nome, progetto, data e tempo previsto. Lo stesso modulo serve per
             creare e per modificare un obiettivo: JavaScript cambia il titolo,
             il testo del pulsante e mostra Elimina solo durante una modifica.
             Se nome e progetto sono uguali a quelli di un altro obiettivo,
             Salva si disattiva e compare l'avviso sopra i pulsanti.
             hidden lo nasconde finché non si preme Crea obiettivo o una matita.
             JavaScript: sezioni MODULO e CONTROLLO DEI DOPPIONI di js/obiettivi.js.
             =============================================================== -->
        <form id="goal-form" class="project-form" hidden aria-labelledby="goal-form-title">
          <h3 id="goal-form-title" class="project-form-title">Nuovo obiettivo</h3>

          <label for="goal-name">Nome dell'obiettivo</label>
          <input id="goal-name" name="nome" type="text" required maxlength="80" autocomplete="off">

          <!-- Su schermi larghi progetto e data stanno affiancati; su telefono uno sotto l'altro. -->
          <div class="goal-form-row">
            <div class="goal-field">
              <label for="goal-project">Progetto</label>
              <!--
                JavaScript crea un option per ogni progetto. Le voci di un select possono
                contenere solo testo: la cartella colorata è un svg a parte, sovrapposto
                a sinistra del campo, che JavaScript colora con il colore del progetto scelto.
              -->
              <div class="goal-project-picker">
                <svg id="goal-project-icon" class="goal-project-picker-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"></path>
                </svg>
                <select id="goal-project" name="progetto" required></select>
              </div>
            </div>
            <div class="goal-field">
              <label for="goal-date">Data prevista</label>
              <!-- La data è obbligatoria (required); il valore ha la forma 2026-10-12. -->
              <input id="goal-date" name="data" type="date" required>
            </div>
          </div>

          <!-- =============================================================
               SEZIONE SCELTA DELLE FIAMMINE
               Il tempo previsto: per ora ogni fiammina vale 25 minuti.
               Le fiammine sono radio con lo stesso name: se ne sceglie una sola,
               ma il CSS accende anche tutte quelle prima. Dopo le prime otto,
               la nona fiammina con il + apre una finestrella per sceglierne di più.
               JavaScript: sezioni SCELTA DELLE FIAMMINE e FINESTRELLA DELLE
               FIAMMINE di js/obiettivi.js.
               ============================================================= -->
          <fieldset class="flame-picker">
            <legend>Tempo previsto</legend>
            <div class="flame-options">
              <label class="flame-option">
                <input type="radio" name="fiammine" value="1" aria-label="1 fiammina, 25 minuti" checked>
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#flame-icon"></use></svg>
              </label>
              <label class="flame-option">
                <input type="radio" name="fiammine" value="2" aria-label="2 fiammine, 50 minuti">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#flame-icon"></use></svg>
              </label>
              <label class="flame-option">
                <input type="radio" name="fiammine" value="3" aria-label="3 fiammine, 75 minuti">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#flame-icon"></use></svg>
              </label>
              <label class="flame-option">
                <input type="radio" name="fiammine" value="4" aria-label="4 fiammine, 100 minuti">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#flame-icon"></use></svg>
              </label>
              <label class="flame-option">
                <input type="radio" name="fiammine" value="5" aria-label="5 fiammine, 125 minuti">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#flame-icon"></use></svg>
              </label>
              <label class="flame-option">
                <input type="radio" name="fiammine" value="6" aria-label="6 fiammine, 150 minuti">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#flame-icon"></use></svg>
              </label>
              <label class="flame-option">
                <input type="radio" name="fiammine" value="7" aria-label="7 fiammine, 175 minuti">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#flame-icon"></use></svg>
              </label>
              <label class="flame-option">
                <input type="radio" name="fiammine" value="8" aria-label="8 fiammine, 200 minuti">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#flame-icon"></use></svg>
              </label>
              <!--
                La nona fiammina è un radio come le altre, ma il suo value cambia: è il numero
                scelto nella finestrella, da 9 in su. Cliccandola si apre la finestrella accanto.
                JavaScript aggiorna l'aria-label con il numero scelto e il badge con "+4", "+5"...
              -->
              <label class="flame-option flame-more">
                <input id="goal-flames-more" type="radio" name="fiammine" value="9" aria-label="Più di 8 fiammine" aria-controls="goal-flames-panel">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#flame-icon"></use></svg>
                <span id="goal-flames-more-badge" class="flame-more-badge" aria-hidden="true">+</span>
              </label>
              <!--
                La finestrella: − e + cambiano il numero di fiammine, che si può anche scrivere
                direttamente nel campo al centro, accanto alla sua icona.
              -->
              <div id="goal-flames-panel" class="flame-panel" role="group" aria-label="Numero di fiammine" hidden>
                <button id="goal-flames-less" class="flame-step" type="button" aria-label="Una fiammina in meno" disabled>−</button>
                <span class="flame-count">
                  <!--
                    Un campo di testo, non type="number": così il browser non blocca mai l'invio
                    del modulo per un valore "non valido", e i controlli li fa JavaScript.
                    value="9" è il valore a cui lo riporta reset().
                    JavaScript completa l'aria-label con il massimo: "da 9 a 38".
                  -->
                  <input id="goal-flames-number" class="flame-count-input" type="text" inputmode="numeric" maxlength="2" value="9" autocomplete="off" aria-label="Numero di fiammine">
                  <svg id="goal-flames-panel-icon" class="flame-count-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#flame-icon"></use></svg>
                </span>
                <button id="goal-flames-plus" class="flame-step" type="button" aria-label="Una fiammina in più">+</button>
              </div>
            </div>
            <!-- Il testo "3 fiammine · 1 h 15 min": JavaScript lo aggiorna a ogni scelta. -->
            <output id="goal-flames-output" class="flame-output">1 fiammina · 25 min</output>
          </fieldset>

          <!--
            Compare quando nome e progetto sono uguali a quelli di un altro obiettivo:
            intanto JavaScript disattiva Salva. role="status" lo fa annunciare ai lettori di schermo.
            Usa lo stesso stile dell'avviso nella pagina Progetti.
            JavaScript: sezione CONTROLLO DEI DOPPIONI di js/obiettivi.js.
          -->
          <p id="goal-duplicate-warning" class="project-form-warning" role="status" hidden>
            Esiste già un obiettivo con questo nome in questo progetto.
          </p>

          <!-- I pulsanti del modulo. L'id di Salva serve a JavaScript per cambiarne il testo in "Salva modifiche". -->
          <div class="project-form-actions">
            <button id="save-goal-button" class="project-action project-action-primary" type="submit">Salva obiettivo</button>
            <button id="cancel-goal-button" class="project-action" type="button">Annulla</button>
            <!--
              Elimina compare solo durante una modifica: si raggiunge dalla matita, in due passaggi,
              così un clic sbagliato nella lista non cancella niente. hidden lo nasconde in creazione.
            -->
            <button id="delete-goal-button" class="project-action goal-delete-action" type="button" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Coperchio, maniglia, contenitore e due righe verticali formano il cestino. -->
                <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6M10 11v6M14 11v6"></path>
              </svg>
              Elimina
            </button>
          </div>
        </form>

        <!-- ===============================================================
             SEZIONE ELENCO DEGLI OBIETTIVI
             Il messaggio per la lista vuota, la lista e il modello di una voce.
             JavaScript: sezioni ELENCO e STATI DEGLI OBIETTIVI di js/obiettivi.js.
             =============================================================== -->
        <!-- JavaScript nasconde questo messaggio quando c'è almeno un obiettivo. -->
        <p id="goals-empty" class="projects-empty">Non hai ancora creato obiettivi.</p>
        <!-- La lista parte vuota: JavaScript crea una voce per ciascun obiettivo. -->
        <ul id="goal-list" class="goal-list" aria-label="Obiettivi creati"></ul>

        <!--
          Il modello di una voce, che JavaScript copia per ogni obiettivo.
          data-stato, scritto da JavaScript sul li, decide l'aspetto: non-completato, in-corso
          o completato. Lo stato si vede dai pulsanti, dal bordo e dalle fiammine, senza
          un'etichetta scritta: a sinistra il cerchio per completare, a destra matita e play.
          Il play porta alla Home, sceglie lì l'obiettivo e fa partire il timer.
        -->
        <template id="goal-item-template">
          <li class="goal">
            <!--
              Il cerchio per completare. È il primo elemento del li, quindi sta all'estrema sinistra.
              aria-pressed è true quando l'obiettivo è completato.
              JavaScript lo disattiva (disabled) finché sull'obiettivo non c'è tempo lavorato.
            -->
            <button class="project-item-action goal-complete" type="button" aria-pressed="false" title="Segna come completato">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Il segno di spunta: obiettivo raggiunto. -->
                <path d="M5 12.5l4.5 4.5L19 7.5"></path>
              </svg>
            </button>
            <div class="goal-main">
              <p class="goal-title"><span class="goal-name"></span></p>
              <p class="goal-details">
                <!-- Prima il tempo previsto (fiammine e minuti), poi la data e il progetto. -->
                <span class="goal-flames">
                  <!--
                    Otto fiammine: JavaScript nasconde quelle oltre il tempo previsto.
                    Oltre le otto ne resta una sola e goal-flames-count mostra il numero: 🔥12.
                    Ogni fiammina ha tre aspetti: vuota (da fare), is-current (da completare,
                    azzurra e tremolante) e is-done (fatta, piena e accesa).
                  -->
                  <span class="goal-flame-icons" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                    <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                    <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                    <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                    <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                    <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                    <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                    <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                  </span>
                  <span class="goal-flames-count"></span>
                  <span class="goal-minutes"></span>
                </span>
                <span class="goal-date">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <!-- Un calendario: il riquadro, la riga dei giorni e i due anelli in alto. -->
                    <path d="M4 6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6ZM4 10h16M8 3v4M16 3v4"></path>
                  </svg>
                  <time class="goal-date-text"></time>
                </span>
                <span class="goal-project">
                  <svg class="goal-project-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"></path>
                  </svg>
                  <span class="goal-project-name"></span>
                </span>
              </p>
            </div>
            <div class="project-item-actions">
              <!--
                La matita apre il modulo con i dati dell'obiettivo, come per i progetti.
                È un'azione secondaria: il CSS la mostra discreta, senza bordo, accanto al play.
              -->
              <button class="project-item-action goal-edit" type="button" title="Modifica obiettivo">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <!-- Una matita inclinata, con la riga che separa la punta dal corpo. -->
                  <path d="M4 20h4L19 9a2.83 2.83 0 0 0-4-4L4 16v4ZM13.5 6.5l4 4"></path>
                </svg>
              </button>
              <!--
                Il play porta alla Home e fa partire il timer su questo obiettivo.
                aria-pressed è true quando l'obiettivo è in corso.
              -->
              <button class="project-item-action goal-start" type="button" aria-pressed="false" title="Avvia nella Home">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <!-- Il triangolo di "play": iniziare a lavorare sull'obiettivo. -->
                  <path d="M8 5.5v13l10-6.5-10-6.5Z"></path>
                </svg>
              </button>
            </div>
          </li>
        </template>

        <!-- ===============================================================
             SEZIONE MESSAGGI
             Resta vuoto: si riempie solo se il browser non riesce a leggere
             o salvare gli obiettivi. role="status" lo fa annunciare ai lettori di schermo.
             =============================================================== -->
        <p id="goals-message" class="projects-message" role="status"></p>
      </section>
    </main>
  </body>
</html>
