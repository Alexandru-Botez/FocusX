<!DOCTYPE html>
<!--
  DOCTYPE indica che il documento usa HTML moderno (HTML5).
  Questi blocchi sono commenti: servono a chi legge il codice e non appaiono nella pagina.
  I tag delimitano gli elementi; gli attributi ne specificano le caratteristiche.
  L'indentazione mostra quali elementi sono contenuti dentro altri elementi.
-->

<!-- html contiene l'intero documento; lang="it" indica la lingua a browser e lettori di schermo. -->
<html lang="it">
  <!-- head contiene le informazioni sulla pagina e i collegamenti alle sue risorse. -->
  <head>
    <!-- UTF-8 permette di interpretare correttamente lettere accentate e altri caratteri. -->
    <meta charset="UTF-8">

    <!--
      Il viewport è l'area in cui il browser mostra la pagina.
      width=device-width usa la larghezza del dispositivo in pixel CSS.
      initial-scale=1.0 imposta lo zoom iniziale al 100%, utile soprattutto sui telefoni.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- theme-color colora di nero la barra del browser su mobile, in continuità con la pagina. -->
    <meta name="theme-color" content="#000000">

    <!-- title è il nome mostrato nella scheda del browser e nei segnalibri. -->
    <title>Obiettivi</title>

    <!-- rel="icon" sceglie l'icona della scheda del browser: riutilizziamo il nostro logo SVG. -->
    <link rel="icon" type="image/svg+xml" href="assets/focusx-mark.svg?v=fiamma-concentrata-2">

    <!--
      link collega una risorsa esterna al documento.
      rel="stylesheet" specifica che si tratta di un foglio di stile CSS.
      href è il percorso del file, relativo alla cartella di questo documento.
    -->
    <link rel="stylesheet" href="styles.css?v=obiettivi-4">

    <!--
      script collega il file JavaScript indicato da src.
      defer permette di scaricarlo mentre il browser legge l'HTML e di eseguirlo
      dopo che il documento è stato analizzato, quando i suoi elementi sono disponibili.
      Il parametro ?v aggiorna l'URL per evitare una vecchia copia del file in cache.
      obiettivi.js gestisce la creazione, gli stati e il salvataggio locale degli obiettivi.
      menu.js gestisce il menu anche nelle altre pagine del sito.
    -->
    <script src="menu.js?v=progetti-1" defer></script>
    <script src="obiettivi.js?v=obiettivi-2" defer></script>
  </head>

  <!-- body contiene gli elementi che formano il contenuto visibile della pagina. -->
  <body>
    <!-- header è l'intestazione della pagina: raggruppa pulsante Menu, logo e nome dell'app. -->
    <header>
      <!--
        Questo button integra l'icona SVG fornita e funziona anche con Invio e Spazio.
        aria-label dà un nome all'icona; aria-expanded indica se il menu è aperto.
        aria-controls contiene l'id del pannello controllato da questo pulsante.
      -->
      <button id="menu-button" type="button" aria-label="Menu" aria-expanded="false" aria-controls="sidebar-menu" title="Menu">
        <!-- viewBox conserva le coordinate originali; il CSS ridimensiona e anima il disegno. -->
        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
          <!-- currentColor riprende il bianco del pulsante; round arrotonda le estremità. -->
          <g fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round">
            <!-- L'ordine dei sei path è importante: il CSS li seleziona con nth-child. -->
            <path d="M72 82.286h28.75"></path>
            <path d="M100.75 103.714l72.482-.143c.043 39.398-32.284 71.434-72.16 71.434-39.878 0-72.204-32.036-72.204-71.554"></path>
            <path d="M72 125.143h28.75"></path>
            <path d="M100.75 103.714l-71.908-.143c.026-39.638 32.352-71.674 72.23-71.674 39.876 0 72.203 32.036 72.203 71.554"></path>
            <path d="M100.75 82.286h28.75"></path>
            <path d="M100.75 125.143h28.75"></path>
          </g>
        </svg>
      </button>

      <!--
        img mostra il logo vettoriale: SVG può essere ingrandito senza perdere nitidezza.
        class="brand-logo" collega questo elemento al selettore .brand-logo nel CSS.
        src indica il file; ?v=fiamma-concentrata-2 è una versione che possiamo cambiare
        quando aggiorniamo il logo, per far richiedere al browser un nuovo URL.
        alt="" indica un'immagine decorativa: il nome dell'app è già presente nel titolo.
        width e height riservano uno spazio di 44 × 44 pixel anche prima del caricamento.
      -->
      <img class="brand-logo" src="assets/focusx-mark.svg?v=fiamma-concentrata-2" alt="" width="44" height="44">

      <!-- h1 è il titolo principale del documento; il CSS ne sceglie font e dimensione. -->
      <h1><a class="brand-link" href="index.html">FocusX</a></h1>
      <!--
        nav identifica il pannello destinato alla navigazione.
        È dentro l'header: il CSS lo sovrappone a logo e titolo, lasciando il pulsante sopra.
        inert rende il menu chiuso non interattivo e lo esclude dai lettori di schermo.
        JavaScript rimuove questo stato quando apre il pannello.
        ul è una lista; Home, Progetti e Obiettivi sono link a una pagina, le altre voci sono pulsanti.
        Questi pulsanti mostrano solo un effetto alla pressione, senza destinazione.
      -->
      <nav id="sidebar-menu" class="sidebar-menu" aria-label="Navigazione principale" inert>
        <ul>
          <!-- Le icone sono decorative: aria-hidden evita di ripetere il nome della voce. -->
          <li>
            <a class="menu-option" href="index.html">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Una casa rappresenta la pagina iniziale, quella del timer. -->
                <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H4a1 1 0 0 1-1-1v-9.5Z"></path>
              </svg>
              <span>Home</span>
            </a>
          </li>
          <li>
            <a class="menu-option" href="progetti.html">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Una cartella rappresenta i progetti. -->
                <path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"></path>
              </svg>
              <span>Progetti</span>
            </a>
          </li>
          <li>
            <a class="menu-option" href="obiettivi.html" aria-current="page">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Un bersaglio rappresenta gli obiettivi. -->
                <circle cx="12" cy="12" r="9"></circle>
                <circle cx="12" cy="12" r="5"></circle>
                <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"></circle>
              </svg>
              <span>Obiettivi</span>
            </a>
          </li>
          <li>
            <button class="menu-option" type="button">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Tre barre di altezza diversa rappresentano le statistiche. -->
                <path d="M3 3v18h18M7 17v-5M12 17V8M17 17V5"></path>
              </svg>
              <span>Statistica</span>
            </button>
          </li>
          <li>
            <button class="menu-option" type="button">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Un ingranaggio con otto denti rappresenta le impostazioni. -->
                <path d="M19.2 10.27L21.91 10.67V13.33L19.2 13.73A7.4 7.4 0 0 1 18.31 15.87L19.95 18.07L18.07 19.95L15.87 18.31A7.4 7.4 0 0 1 13.73 19.2L13.33 21.91H10.67L10.27 19.2A7.4 7.4 0 0 1 8.13 18.31L5.93 19.95L4.05 18.07L5.69 15.87A7.4 7.4 0 0 1 4.8 13.73L2.09 13.33V10.67L4.8 10.27A7.4 7.4 0 0 1 5.69 8.13L4.05 5.93L5.93 4.05L8.13 5.69A7.4 7.4 0 0 1 10.27 4.8L10.67 2.09H13.33L13.73 4.8A7.4 7.4 0 0 1 15.87 5.69L18.07 4.05L19.95 5.93L18.31 8.13A7.4 7.4 0 0 1 19.2 10.27Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span>Impostazioni</span>
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <!--
      Questo svg non si vede: contiene solo un symbol, un disegno con un id.
      Ogni <use href="#flame-icon"> lo richiama, così la fiammina è scritta una volta sola
      anche se compare molte volte nella pagina.
    -->
    <svg hidden>
      <symbol id="flame-icon" viewBox="0 0 24 24">
        <path d="M12 2.5c.6 3.2 2.6 4.9 4.2 6.9 1.4 1.7 2.3 3.5 2.3 5.6a6.5 6.5 0 0 1-13 0c0-2.4 1.2-4.4 2.9-5.9.1 1.5.8 2.7 2 3.2-.6-3.4.3-6.8 1.6-9.8Z"></path>
      </symbol>
    </svg>

    <!--
      Questa pagina carica obiettivi.js e menu.js. Riutilizza le classi di layout,
      modulo e pulsanti della pagina Progetti, così le due pagine restano coerenti.
    -->
    <main class="projects-main">
      <section class="projects-section" aria-labelledby="goals-heading">
        <div class="projects-heading-row">
          <h2 id="goals-heading">Obiettivi</h2>
          <button id="new-goal-button" class="project-action project-action-primary" type="button">Crea obiettivo</button>
        </div>

        <!-- Ogni obiettivo appartiene a un progetto: senza progetti, questo avviso porta a crearne uno. -->
        <p id="goals-no-projects" class="projects-empty" hidden>
          Per creare un obiettivo serve almeno un progetto. <a href="progetti.html">Vai ai progetti</a>
        </p>

        <form id="goal-form" class="project-form" hidden aria-labelledby="goal-form-title">
          <h3 id="goal-form-title" class="project-form-title">Nuovo obiettivo</h3>

          <label for="goal-name">Nome dell'obiettivo</label>
          <input id="goal-name" name="nome" type="text" required maxlength="80" autocomplete="off">

          <!-- Su schermi larghi progetto e data stanno affiancati; su telefono uno sotto l'altro. -->
          <div class="goal-form-row">
            <div class="goal-field">
              <label for="goal-project">Progetto</label>
              <!-- select è un menu a tendina: JavaScript crea un option per ogni progetto. -->
              <select id="goal-project" name="progetto" required></select>
            </div>
            <div class="goal-field">
              <label for="goal-date">Data prevista</label>
              <!-- type="date" mostra il calendario del browser; il valore ha la forma 2026-10-12. -->
              <input id="goal-date" name="data" type="date">
            </div>
          </div>

          <!--
            Le fiammine sono radio con lo stesso name: se ne sceglie una sola, ma il CSS
            accende anche tutte quelle prima. Ogni fiammina vale 25 minuti.
          -->
          <fieldset class="flame-picker">
            <legend>Tempo previsto</legend>
            <div class="flame-options">
              <label class="flame-option">
                <input type="radio" name="fiammine" value="1" aria-label="1 fiammina, 25 minuti" checked>
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#flame-icon"></use></svg>
              </label>
              <label class="flame-option">
                <input type="radio" name="fiammine" value="2" aria-label="2 fiammine, 50 minuti">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#flame-icon"></use></svg>
              </label>
              <label class="flame-option">
                <input type="radio" name="fiammine" value="3" aria-label="3 fiammine, 75 minuti">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#flame-icon"></use></svg>
              </label>
              <label class="flame-option">
                <input type="radio" name="fiammine" value="4" aria-label="4 fiammine, 100 minuti">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#flame-icon"></use></svg>
              </label>
              <label class="flame-option">
                <input type="radio" name="fiammine" value="5" aria-label="5 fiammine, 125 minuti">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#flame-icon"></use></svg>
              </label>
              <label class="flame-option">
                <input type="radio" name="fiammine" value="6" aria-label="6 fiammine, 150 minuti">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#flame-icon"></use></svg>
              </label>
              <label class="flame-option">
                <input type="radio" name="fiammine" value="7" aria-label="7 fiammine, 175 minuti">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#flame-icon"></use></svg>
              </label>
              <label class="flame-option">
                <input type="radio" name="fiammine" value="8" aria-label="8 fiammine, 200 minuti">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#flame-icon"></use></svg>
              </label>
            </div>
            <!-- output mostra un risultato calcolato; JavaScript lo aggiorna a ogni scelta. -->
            <output id="goal-flames-output" class="flame-output">1 fiammina · 25 min</output>
          </fieldset>

          <div class="project-form-actions">
            <button class="project-action project-action-primary" type="submit">Salva obiettivo</button>
            <button id="cancel-goal-button" class="project-action" type="button">Annulla</button>
          </div>
        </form>

        <p id="goals-empty" class="projects-empty">Non hai ancora creato obiettivi.</p>
        <ul id="goal-list" class="goal-list" aria-label="Obiettivi creati"></ul>

        <!--
          Modello di un obiettivo. data-stato, scritto da JavaScript sul li, decide l'aspetto:
          non-completato, in-corso o completato. A destra, i pulsanti per cambiare stato.
        -->
        <template id="goal-item-template">
          <li class="goal">
            <div class="goal-main">
              <p class="goal-title"><span class="goal-name"></span></p>
              <p class="goal-details">
                <span class="goal-project">
                  <svg class="goal-project-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"></path>
                  </svg>
                  <span class="goal-project-name"></span>
                </span>
                <span class="goal-date">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <!-- Un calendario: il riquadro, la riga dei giorni e i due anelli in alto. -->
                    <path d="M4 6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6ZM4 10h16M8 3v4M16 3v4"></path>
                  </svg>
                  <!-- time indica una data leggibile anche dalle macchine, tramite datetime. -->
                  <time class="goal-date-text"></time>
                </span>
                <span class="goal-flames">
                  <!-- Otto fiammine: JavaScript nasconde quelle oltre il tempo previsto. -->
                  <span class="goal-flame-icons" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                    <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                    <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                    <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                    <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                    <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                    <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                    <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                  </span>
                  <span class="goal-minutes"></span>
                </span>
              </p>
              <span class="goal-state"></span>
            </div>
            <div class="project-item-actions">
              <!-- aria-pressed dice se il pulsante è attivo: true quando l'obiettivo è in quello stato. -->
              <button class="project-item-action goal-start" type="button" aria-pressed="false" title="Metti in corso">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <!-- Il triangolo di "play": iniziare a lavorare sull'obiettivo. -->
                  <path d="M8 5.5v13l10-6.5-10-6.5Z"></path>
                </svg>
              </button>
              <button class="project-item-action goal-complete" type="button" aria-pressed="false" title="Segna come completato">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <!-- Il segno di spunta: obiettivo raggiunto. -->
                  <path d="M5 12.5l4.5 4.5L19 7.5"></path>
                </svg>
              </button>
            </div>
          </li>
        </template>

        <!-- role=status annuncia l'esito senza interrompere la lettura. -->
        <p id="goals-message" class="projects-message" role="status"></p>
      </section>
    </main>
  </body>
</html>
