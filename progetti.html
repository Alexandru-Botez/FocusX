<!DOCTYPE html>
<!--
  DOCTYPE indica che il documento usa HTML moderno (HTML5).
  Questi blocchi sono commenti: servono a chi legge il codice e non appaiono nella pagina.
  I tag delimitano gli elementi; gli attributi ne specificano le caratteristiche.
  L'indentazione mostra quali elementi sono contenuti dentro altri elementi.
-->

<!-- html contiene l'intero documento; lang="it" indica la lingua a browser e lettori di schermo. -->
<html lang="it">
  <!-- head contiene le informazioni sulla pagina e i collegamenti alle sue risorse. -->
  <head>
    <!-- UTF-8 permette di interpretare correttamente lettere accentate e altri caratteri. -->
    <meta charset="UTF-8">

    <!--
      Il viewport è l'area in cui il browser mostra la pagina.
      width=device-width usa la larghezza del dispositivo in pixel CSS.
      initial-scale=1.0 imposta lo zoom iniziale al 100%, utile soprattutto sui telefoni.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- theme-color colora di nero la barra del browser su mobile, in continuità con la pagina. -->
    <meta name="theme-color" content="#000000">

    <!-- title è il nome mostrato nella scheda del browser e nei segnalibri. -->
    <title>Progetti</title>

    <!-- rel="icon" sceglie l'icona della scheda del browser: riutilizziamo il nostro logo SVG. -->
    <link rel="icon" type="image/svg+xml" href="assets/focusx-mark.svg?v=fiamma-concentrata-2">

    <!--
      link collega una risorsa esterna al documento.
      rel="stylesheet" specifica che si tratta di un foglio di stile CSS.
      href è il percorso del file, relativo alla cartella di questo documento.
    -->
    <link rel="stylesheet" href="styles.css?v=modifica-progetto-1">

    <!--
      script collega il file JavaScript indicato da src.
      defer permette di scaricarlo mentre il browser legge l'HTML e di eseguirlo
      dopo che il documento è stato analizzato, quando i suoi elementi sono disponibili.
      Il parametro ?v aggiorna l'URL per evitare una vecchia copia del file in cache.
      progetti.js gestisce la creazione e il salvataggio locale dei progetti.
      menu.js gestisce il menu anche nelle altre pagine del sito.
    -->
    <script src="menu.js?v=progetti-1" defer></script>
    <script src="progetti.js?v=nuovo-in-cima-1" defer></script>
  </head>

  <!-- body contiene gli elementi che formano il contenuto visibile della pagina. -->
  <body>
    <!-- header è l'intestazione della pagina: raggruppa pulsante Menu, logo e nome dell'app. -->
    <header>
      <!--
        Questo button integra l'icona SVG fornita e funziona anche con Invio e Spazio.
        aria-label dà un nome all'icona; aria-expanded indica se il menu è aperto.
        aria-controls contiene l'id del pannello controllato da questo pulsante.
      -->
      <button id="menu-button" type="button" aria-label="Menu" aria-expanded="false" aria-controls="sidebar-menu" title="Menu">
        <!-- viewBox conserva le coordinate originali; il CSS ridimensiona e anima il disegno. -->
        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
          <!-- currentColor riprende il bianco del pulsante; round arrotonda le estremità. -->
          <g fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round">
            <!-- L'ordine dei sei path è importante: il CSS li seleziona con nth-child. -->
            <path d="M72 82.286h28.75"></path>
            <path d="M100.75 103.714l72.482-.143c.043 39.398-32.284 71.434-72.16 71.434-39.878 0-72.204-32.036-72.204-71.554"></path>
            <path d="M72 125.143h28.75"></path>
            <path d="M100.75 103.714l-71.908-.143c.026-39.638 32.352-71.674 72.23-71.674 39.876 0 72.203 32.036 72.203 71.554"></path>
            <path d="M100.75 82.286h28.75"></path>
            <path d="M100.75 125.143h28.75"></path>
          </g>
        </svg>
      </button>

      <!--
        img mostra il logo vettoriale: SVG può essere ingrandito senza perdere nitidezza.
        class="brand-logo" collega questo elemento al selettore .brand-logo nel CSS.
        src indica il file; ?v=fiamma-concentrata-2 è una versione che possiamo cambiare
        quando aggiorniamo il logo, per far richiedere al browser un nuovo URL.
        alt="" indica un'immagine decorativa: il nome dell'app è già presente nel titolo.
        width e height riservano uno spazio di 44 × 44 pixel anche prima del caricamento.
      -->
      <img class="brand-logo" src="assets/focusx-mark.svg?v=fiamma-concentrata-2" alt="" width="44" height="44">

      <!-- h1 è il titolo principale del documento; il CSS ne sceglie font e dimensione. -->
      <h1><a class="brand-link" href="index.html">FocusX</a></h1>
      <!--
        nav identifica il pannello destinato alla navigazione.
        È dentro l'header: il CSS lo sovrappone a logo e titolo, lasciando il pulsante sopra.
        inert rende il menu chiuso non interattivo e lo esclude dai lettori di schermo.
        JavaScript rimuove questo stato quando apre il pannello.
        ul è una lista; Home e Progetti sono link a una pagina, le altre voci sono pulsanti.
        Questi pulsanti mostrano solo un effetto alla pressione, senza destinazione.
      -->
      <nav id="sidebar-menu" class="sidebar-menu" aria-label="Navigazione principale" inert>
        <ul>
          <!-- Le icone sono decorative: aria-hidden evita di ripetere il nome della voce. -->
          <li>
            <a class="menu-option" href="index.html">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Una casa rappresenta la pagina iniziale, quella del timer. -->
                <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H4a1 1 0 0 1-1-1v-9.5Z"></path>
              </svg>
              <span>Home</span>
            </a>
          </li>
          <li>
            <a class="menu-option" href="progetti.html" aria-current="page">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Una cartella rappresenta i progetti. -->
                <path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"></path>
              </svg>
              <span>Progetti</span>
            </a>
          </li>
          <li>
            <button class="menu-option" type="button">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Un bersaglio rappresenta gli obiettivi. -->
                <circle cx="12" cy="12" r="9"></circle>
                <circle cx="12" cy="12" r="5"></circle>
                <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"></circle>
              </svg>
              <span>Obiettivi</span>
            </button>
          </li>
          <li>
            <button class="menu-option" type="button">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Tre barre di altezza diversa rappresentano le statistiche. -->
                <path d="M3 3v18h18M7 17v-5M12 17V8M17 17V5"></path>
              </svg>
              <span>Statistica</span>
            </button>
          </li>
          <li>
            <button class="menu-option" type="button">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Un ingranaggio con otto denti rappresenta le impostazioni. -->
                <path d="M19.2 10.27L21.91 10.67V13.33L19.2 13.73A7.4 7.4 0 0 1 18.31 15.87L19.95 18.07L18.07 19.95L15.87 18.31A7.4 7.4 0 0 1 13.73 19.2L13.33 21.91H10.67L10.27 19.2A7.4 7.4 0 0 1 8.13 18.31L5.93 19.95L4.05 18.07L5.69 15.87A7.4 7.4 0 0 1 4.8 13.73L2.09 13.33V10.67L4.8 10.27A7.4 7.4 0 0 1 5.69 8.13L4.05 5.93L5.93 4.05L8.13 5.69A7.4 7.4 0 0 1 10.27 4.8L10.67 2.09H13.33L13.73 4.8A7.4 7.4 0 0 1 15.87 5.69L18.07 4.05L19.95 5.93L18.31 8.13A7.4 7.4 0 0 1 19.2 10.27Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span>Impostazioni</span>
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <!-- Questa pagina carica progetti.js e menu.js; il timer vive nella pagina index.html. -->
    <main class="projects-main">
      <section class="projects-section" aria-labelledby="projects-heading">
        <div class="projects-heading-row">
          <h2 id="projects-heading">Progetti</h2>
          <button id="new-project-button" class="project-action project-action-primary" type="button">Crea progetto</button>
        </div>

        <!-- hidden nasconde il modulo finché l'utente non preme Crea progetto. -->
        <!--
          Lo stesso modulo serve per creare e per modificare un progetto:
          JavaScript cambia il titolo e il testo del pulsante di salvataggio.
        -->
        <form id="project-form" class="project-form" hidden aria-labelledby="project-form-title">
          <h3 id="project-form-title" class="project-form-title">Nuovo progetto</h3>
          <!-- for collega l'etichetta all'input; required e maxlength validano il campo. -->
          <label for="project-name">Nome del progetto</label>
          <input id="project-name" name="nome" type="text" required maxlength="80" autocomplete="off">

          <!--
            fieldset raggruppa i controlli collegati; legend è il nome del gruppo.
            I radio con lo stesso name formano una scelta unica: se ne seleziona uno solo.
            value è il colore salvato; --swatch, una variabile CSS, colora il cerchio.
            aria-label e title danno un nome al colore, perché il cerchio non contiene testo.
            checked sceglie il colore predefinito, che Annulla e reset() ripristinano.
          -->
          <fieldset class="project-colors">
            <legend>Colore</legend>
            <input type="radio" name="colore" value="#f5f5f5" style="--swatch: #f5f5f5" aria-label="Bianco" title="Bianco" checked>
            <input type="radio" name="colore" value="#ff6b6b" style="--swatch: #ff6b6b" aria-label="Rosso" title="Rosso">
            <input type="radio" name="colore" value="#ffa94d" style="--swatch: #ffa94d" aria-label="Arancione" title="Arancione">
            <input type="radio" name="colore" value="#ffd43b" style="--swatch: #ffd43b" aria-label="Giallo" title="Giallo">
            <input type="radio" name="colore" value="#a9e34b" style="--swatch: #a9e34b" aria-label="Lime" title="Lime">
            <input type="radio" name="colore" value="#69db7c" style="--swatch: #69db7c" aria-label="Verde" title="Verde">
            <input type="radio" name="colore" value="#38d9a9" style="--swatch: #38d9a9" aria-label="Verde acqua" title="Verde acqua">
            <input type="radio" name="colore" value="#3bc9db" style="--swatch: #3bc9db" aria-label="Ciano" title="Ciano">
            <input type="radio" name="colore" value="#4dabf7" style="--swatch: #4dabf7" aria-label="Azzurro" title="Azzurro">
            <input type="radio" name="colore" value="#748ffc" style="--swatch: #748ffc" aria-label="Indaco" title="Indaco">
            <input type="radio" name="colore" value="#b197fc" style="--swatch: #b197fc" aria-label="Viola" title="Viola">
            <input type="radio" name="colore" value="#f783ac" style="--swatch: #f783ac" aria-label="Rosa" title="Rosa">

            <!--
              popovertarget collega il pulsante + alla finestrella con id="more-colors":
              il browser la apre e la chiude al clic, senza JavaScript.
              type="button" evita che il pulsante invii il modulo.
            -->
            <button id="more-colors-button" class="more-colors-button" type="button" popovertarget="more-colors" aria-label="Altri colori" title="Altri colori">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 5v14M5 12h14"></path>
              </svg>
            </button>

            <!--
              popover rende il div una finestrella sopra la pagina, nascosta finché non viene aperta.
              Si chiude con Esc o con un clic fuori. I radio dentro hanno lo stesso name="colore":
              fanno parte della stessa scelta dei dodici colori principali.
            -->
            <div id="more-colors" class="more-colors" popover>
              <p class="more-colors-title">Altri colori</p>
              <div class="more-colors-grid">
                <input type="radio" name="colore" value="#f03e3e" style="--swatch: #f03e3e" aria-label="Rosso intenso" title="Rosso intenso">
                <input type="radio" name="colore" value="#f76707" style="--swatch: #f76707" aria-label="Arancione intenso" title="Arancione intenso">
                <input type="radio" name="colore" value="#f59f00" style="--swatch: #f59f00" aria-label="Ambra" title="Ambra">
                <input type="radio" name="colore" value="#74b816" style="--swatch: #74b816" aria-label="Erba" title="Erba">
                <input type="radio" name="colore" value="#37b24d" style="--swatch: #37b24d" aria-label="Verde intenso" title="Verde intenso">
                <input type="radio" name="colore" value="#0ca678" style="--swatch: #0ca678" aria-label="Smeraldo" title="Smeraldo">
                <input type="radio" name="colore" value="#1098ad" style="--swatch: #1098ad" aria-label="Petrolio" title="Petrolio">
                <input type="radio" name="colore" value="#228be6" style="--swatch: #228be6" aria-label="Blu" title="Blu">
                <input type="radio" name="colore" value="#5c7cfa" style="--swatch: #5c7cfa" aria-label="Indaco intenso" title="Indaco intenso">
                <input type="radio" name="colore" value="#845ef7" style="--swatch: #845ef7" aria-label="Viola intenso" title="Viola intenso">
                <input type="radio" name="colore" value="#be4bdb" style="--swatch: #be4bdb" aria-label="Uva" title="Uva">
                <input type="radio" name="colore" value="#e64980" style="--swatch: #e64980" aria-label="Lampone" title="Lampone">
              </div>
            </div>
          </fieldset>

          <div class="project-form-actions">
            <button id="save-project-button" class="project-action project-action-primary" type="submit">Salva progetto</button>
            <button id="cancel-project-button" class="project-action" type="button">Annulla</button>
          </div>
        </form>

        <p id="projects-empty" class="projects-empty">Non hai ancora creato progetti.</p>
        <!-- JavaScript crea una voce per ciascun progetto, usando textContent per il nome. -->
        <ul id="project-list" class="project-list" aria-label="Progetti creati"></ul>
        <!--
          template non viene mostrato: è un modello che JavaScript copia per ogni progetto.
          La cartella prende il colore del progetto e lo span riceve il nome.
          A destra, la matita apre il modulo per modificarlo e il cestino lo elimina.
        -->
        <template id="project-item-template">
          <li>
            <svg class="project-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <!-- La stessa cartella della voce Progetti nel menu, qui piena. -->
              <path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"></path>
            </svg>
            <span class="project-name"></span>
            <div class="project-item-actions">
              <button class="project-item-action project-edit" type="button" title="Modifica progetto">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <!-- Una matita inclinata, con la riga che separa la punta dal corpo. -->
                  <path d="M4 20h4L19 9a2.83 2.83 0 0 0-4-4L4 16v4ZM13.5 6.5l4 4"></path>
                </svg>
              </button>
              <button class="project-item-action project-delete" type="button" title="Elimina progetto">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <!-- Coperchio, maniglia, contenitore e due righe verticali formano il cestino. -->
                  <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6M10 11v6M14 11v6"></path>
                </svg>
              </button>
            </div>
          </li>
        </template>
        <!-- role=status annuncia l'esito senza interrompere la lettura. -->
        <p id="projects-message" class="projects-message" role="status"></p>
      </section>
    </main>
  </body>
</html>
