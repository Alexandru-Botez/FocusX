<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Il cervello compare soltanto nella piccola porzione sopra il taglio. -->
    <clipPath id="brain-cap">
      <path d="M0 0H48V7L0 23Z"/>
    </clipPath>
  </defs>

  <!-- Il contorno usa solo segmenti: nuca dritta e sommità sfaccettata. -->
  <path d="M18 4L8.5 12.5V26L14.5 35V44H26.5V38L31.7 36.4L35.8 32.1V29.1L34.2 28L36.2 26.5L40.5 25.5L35.2 19.8L33 12.4L29.2 6.5L25.5 4Z" fill="#f5f5f5"/>

  <!-- Un piccolo segno geometrico rende più leggibile il profilo. -->
  <path d="M27 20H31L29.5 22Z" fill="#000000"/>

  <!-- I pochi solchi ampi mantengono il cervello leggibile in piccolo. -->
  <g clip-path="url(#brain-cap)">
    <path d="M17 5.5C14.5 8.2 14.8 11.5 17.5 13C20 14.4 20.3 17.1 18.8 19.1M25 4C23.2 6.3 23.7 9.4 26.3 10.6M9 11.5C12.7 10.1 15.1 11.4 15.8 14.2M33 9C30.2 9.3 28.6 11.5 29 13.8" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- La fessura diagonale è più sottile del precedente taglio orizzontale. -->
  <path d="M6 21L39 10" stroke="#000000" stroke-width="1.6"/>
</svg>
