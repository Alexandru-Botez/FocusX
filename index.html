<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusX - Timer Pomodoro</title>

    <!-- Il CSS definirà l'aspetto della pagina. -->
    <link rel="stylesheet" href="styles.css">

    <!-- defer esegue lo script dopo che l'HTML è stato letto. -->
    <script src="script.js" defer></script>
  </head>

  <body>
    <header>
      <!-- Un piccolo logo SVG: rimane nitido a qualsiasi dimensione. -->
      <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect x="1" y="1" width="30" height="30" rx="9" fill="currentColor"></rect>
        <circle cx="16" cy="16" r="9" fill="none" stroke="white" stroke-width="1.5"></circle>
        <path d="M16 10v6l4 2" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <h1>FocusX</h1>
    </header>

    <main>
      <section aria-label="Timer Pomodoro">
        <p id="timer" role="timer" aria-live="off">25:00</p>

        <div class="timer-controls">
          <!-- aria-label dà un nome ai pulsanti anche senza testo visibile. -->
          <button id="start-button" type="button" aria-label="Avvia" title="Avvia">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M9 5l10 7-10 7z" fill="currentColor"></path>
            </svg>
          </button>
          <button id="pause-button" type="button" aria-label="Pausa" title="Pausa">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"></rect>
              <rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"></rect>
            </svg>
          </button>
          <button id="reset-button" type="button">Reset</button>
        </div>

        <p id="timer-status" role="status">Pronto per iniziare.</p>
      </section>
    </main>
  </body>
</html>
