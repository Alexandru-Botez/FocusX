<!DOCTYPE html>
<!--
  =====================================================================
  INDEX.HTML: la pagina Home, con l'obiettivo scelto e il timer Pomodoro da 25 minuti.
  Stile: css/styles.css. Comportamento: js/menu.js, js/timer.js e js/home-obiettivo.js.

  Sezioni, nell'ordine:
    - HEAD: informazioni sulla pagina e file collegati
    - INTESTAZIONE E MENU, uguale in tutte le pagine
    - ICONE: il disegno della fiammina, scritto una volta sola
    - OBIETTIVO SCELTO, sopra il timer
    - TIMER
  =====================================================================
-->
<html lang="it">
  <!-- =================================================================
       SEZIONE HEAD
       Informazioni sulla pagina e file collegati.
       Il parametro ?v nei percorsi cambia a ogni modifica di un file,
       così il browser non usa una vecchia copia salvata.
       type="module": ogni file JavaScript è un modulo, con i suoi nomi
       privati, che parte dopo che il browser ha letto tutto l'HTML.
       I moduli funzionano solo aprendo la pagina da un server
       (python -m http.server), non con un doppio clic sul file.
       ================================================================= -->
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Home</title>
    <link rel="icon" type="image/svg+xml" href="assets/focusx-mark.svg?v=fiamma-concentrata-2">
    <link rel="stylesheet" href="css/styles.css?v=numero-blu-1">
    <script type="module" src="js/menu.js?v=avvia-1"></script>
    <script type="module" src="js/timer.js?v=status-1"></script>
    <script type="module" src="js/home-obiettivo.js?v=avvia-1"></script>
  </head>

  <body>
    <!-- =================================================================
         SEZIONE INTESTAZIONE E MENU
         Pulsante del menu, logo, nome dell'app e pannello del menu.
         È uguale in tutte e tre le pagine: cambia solo la voce con
         aria-current="page", quella della pagina aperta.
         Se la modifichi, aggiorna tutti e tre i file HTML.
         JavaScript: js/menu.js.
         ================================================================= -->
    <header>
      <!-- Quando il menu si apre, l'icona a tre linee si trasforma in una X dentro un cerchio. -->
      <button id="menu-button" type="button" aria-label="Menu" aria-expanded="false" aria-controls="sidebar-menu" title="Menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round">
            <!-- L'ordine dei sei path è importante: il CSS li seleziona con nth-child. -->
            <path d="M72 82.286h28.75"></path>
            <path d="M100.75 103.714l72.482-.143c.043 39.398-32.284 71.434-72.16 71.434-39.878 0-72.204-32.036-72.204-71.554"></path>
            <path d="M72 125.143h28.75"></path>
            <path d="M100.75 103.714l-71.908-.143c.026-39.638 32.352-71.674 72.23-71.674 39.876 0 72.203 32.036 72.203 71.554"></path>
            <path d="M100.75 82.286h28.75"></path>
            <path d="M100.75 125.143h28.75"></path>
          </g>
        </svg>
      </button>

      <!--
        Il logo è un link a Home, come il nome FocusX accanto. Per la tastiera e i lettori
        di schermo basta il link del nome: tabindex="-1" e aria-hidden="true" evitano
        che lo stesso link venga raggiunto e annunciato due volte.
      -->
      <a class="brand-logo-link" href="index.html" tabindex="-1" aria-hidden="true">
        <img class="brand-logo" src="assets/focusx-mark.svg?v=fiamma-concentrata-2" alt="" width="44" height="44">
      </a>

      <h1><a class="brand-link" href="index.html">FocusX</a></h1>

      <!--
        Il pannello del menu. Il CSS lo sovrappone a logo e titolo, lasciando sopra il pulsante.
        inert lo rende non interattivo finché è chiuso: js/menu.js lo toglie quando si apre.
        Statistica e Impostazioni per ora sono pulsanti senza destinazione:
        le loro pagine non esistono ancora.
      -->
      <nav id="sidebar-menu" class="sidebar-menu" aria-label="Navigazione principale" inert>
        <ul>
          <li>
            <a class="menu-option" href="index.html" aria-current="page">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Una casa: la pagina iniziale, quella del timer. -->
                <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H4a1 1 0 0 1-1-1v-9.5Z"></path>
              </svg>
              <span>Home</span>
            </a>
          </li>
          <li>
            <a class="menu-option" href="progetti.html">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Una cartella: i progetti. -->
                <path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"></path>
              </svg>
              <span>Progetti</span>
            </a>
          </li>
          <li>
            <a class="menu-option" href="obiettivi.html">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Un bersaglio: gli obiettivi. -->
                <circle cx="12" cy="12" r="9"></circle>
                <circle cx="12" cy="12" r="5"></circle>
                <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"></circle>
              </svg>
              <span>Obiettivi</span>
            </a>
          </li>
          <li>
            <button class="menu-option" type="button">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Tre barre di altezza diversa: le statistiche. -->
                <path d="M3 3v18h18M7 17v-5M12 17V8M17 17V5"></path>
              </svg>
              <span>Statistica</span>
            </button>
          </li>
          <li>
            <button class="menu-option" type="button">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!-- Un ingranaggio con otto denti: le impostazioni. -->
                <path d="M19.2 10.27L21.91 10.67V13.33L19.2 13.73A7.4 7.4 0 0 1 18.31 15.87L19.95 18.07L18.07 19.95L15.87 18.31A7.4 7.4 0 0 1 13.73 19.2L13.33 21.91H10.67L10.27 19.2A7.4 7.4 0 0 1 8.13 18.31L5.93 19.95L4.05 18.07L5.69 15.87A7.4 7.4 0 0 1 4.8 13.73L2.09 13.33V10.67L4.8 10.27A7.4 7.4 0 0 1 5.69 8.13L4.05 5.93L5.93 4.05L8.13 5.69A7.4 7.4 0 0 1 10.27 4.8L10.67 2.09H13.33L13.73 4.8A7.4 7.4 0 0 1 15.87 5.69L18.07 4.05L19.95 5.93L18.31 8.13A7.4 7.4 0 0 1 19.2 10.27Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span>Impostazioni</span>
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <!-- =================================================================
         SEZIONE ICONE
         Il disegno della fiammina, scritto una volta sola: ogni
         <use href="#flame-icon"> nella pagina lo richiama.
         È lo stesso della pagina Obiettivi.
         ================================================================= -->
    <svg hidden>
      <symbol id="flame-icon" viewBox="0 0 24 24">
        <path d="M12 2.5c.6 3.2 2.6 4.9 4.2 6.9 1.4 1.7 2.3 3.5 2.3 5.6a6.5 6.5 0 0 1-13 0c0-2.4 1.2-4.4 2.9-5.9.1 1.5.8 2.7 2 3.2-.6-3.4.3-6.8 1.6-9.8Z"></path>
      </symbol>
    </svg>

    <!-- =================================================================
         SEZIONE TIMER
         Il tempo che scorre, i pulsanti Avvia, Pausa e Stop
         e il messaggio sullo stato del timer. Sopra, l'obiettivo scelto.
         JavaScript: js/timer.js.
         ================================================================= -->
    <main>
      <section aria-label="Timer Pomodoro">
        <!-- ===============================================================
             SEZIONE OBIETTIVO SCELTO
             L'obiettivo su cui si lavora, in una pillola: cerchio per
             completarlo, nome e fiammine. Un clic sul blocco apre sotto una
             finestrella con gli obiettivi da fare. Avvia mette in corso
             quello scelto, Pausa e Stop lo fermano.
             Usa le stesse classi della lista obiettivi (goal-name,
             goal-flame-icons...), così fiammine e stati hanno lo stesso aspetto.
             JavaScript: js/home-obiettivo.js.
             =============================================================== -->
        <div id="home-goal" class="home-goal" data-stato="nessuno">
          <!-- Il cerchio compare solo quando un obiettivo è scelto. -->
          <button id="home-goal-complete" class="goal-complete" type="button" aria-pressed="false" title="Segna come completato" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <!-- Il segno di spunta: obiettivo raggiunto. -->
              <path d="M5 12.5l4.5 4.5L19 7.5"></path>
            </svg>
          </button>

          <!--
            Tutto il resto del blocco è un unico pulsante che apre la finestrella.
            aria-expanded dice se è aperta; JavaScript scrive l'aria-label con il nome scelto.
          -->
          <button id="home-goal-picker" class="home-goal-picker" type="button" aria-expanded="false" aria-controls="home-goal-panel">
            <span class="home-goal-title"><span id="home-goal-name" class="goal-name">Scegli un obiettivo</span></span>
            <span id="home-goal-details" class="goal-details home-goal-details" hidden>
              <!-- Otto fiammine: JavaScript nasconde quelle in più e dà a ognuna il suo aspetto. -->
              <span id="home-goal-flames" class="goal-flame-icons" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
                <svg viewBox="0 0 24 24" focusable="false"><use href="#flame-icon"></use></svg>
              </span>
              <span id="home-goal-flames-count" class="goal-flames-count" hidden></span>
              <span id="home-goal-minutes" class="goal-minutes"></span>
            </span>
            <svg class="home-goal-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <!-- Una freccia verso il basso: il blocco si apre. -->
              <path d="M6 9l6 6 6-6"></path>
            </svg>
          </button>

          <!-- La finestrella sotto il blocco, con gli obiettivi non ancora completati. -->
          <div id="home-goal-panel" class="home-goal-panel" hidden>
            <p class="home-goal-panel-title">Scegli un obiettivo</p>
            <ul id="home-goal-options" class="home-goal-options" aria-label="Obiettivi da fare"></ul>
            <p id="home-goal-empty" class="home-goal-panel-empty" hidden>
              Non ci sono obiettivi da fare. <a href="obiettivi.html">Crea un obiettivo</a>
            </p>
          </div>

          <!-- Il modello di una voce della finestrella, che JavaScript copia per ogni obiettivo. -->
          <template id="home-goal-option-template">
            <li>
              <button class="home-goal-option" type="button" aria-pressed="false">
                <svg class="home-goal-option-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <!-- La cartella del progetto, con il suo colore. -->
                  <path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"></path>
                </svg>
                <span class="home-goal-option-name"></span>
                <span class="home-goal-option-time"></span>
              </button>
            </li>
          </template>
        </div>

        <!-- aria-live="off" evita che i lettori di schermo annuncino ogni secondo del conto alla rovescia. -->
        <p id="timer" role="timer" aria-live="off">25:00</p>

        <div class="timer-controls">
          <button id="start-button" type="button" aria-label="Avvia" title="Avvia">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M9 5l10 7-10 7z" fill="currentColor"></path>
            </svg>
          </button>

          <!-- Pausa e Stop partono disattivati: js/timer.js li attiva all'avvio. -->
          <button id="pause-button" type="button" aria-label="Pausa" title="Pausa" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"></rect>
              <rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"></rect>
            </svg>
          </button>

          <!-- Stop finisce la sessione: ferma il timer e lo riporta a 25:00. -->
          <button id="stop-button" type="button" aria-label="Stop" title="Stop" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"></rect>
            </svg>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
